name: CI Build Verification

on:
  push:
    branches: [ "main" ]
  pull_request:
    branches: [ "main" ]

jobs:
  verify-environment:
    runs-on: ubuntu-latest

    steps:
    - name: Check out repository code
      uses: actions/checkout@v4

    - name: Set up Docker Buildx Engine
      uses: docker/setup-buildx-action@v3

    - name: Run Validation Build Test
      run: |
        docker build -t pump-scada-edge:test .

    - name: Set up Python
      uses: actions/setup-python@v5
      with:
        python-version: '3.11'
    - name: Install test dependencies
      run: pip install pytest
    - name: Run unit tests
      run: pytest cavitation_detector/test_facility_scada.py
    - name: Install test dependencies
      run: pip install -r requirements.txt pytest