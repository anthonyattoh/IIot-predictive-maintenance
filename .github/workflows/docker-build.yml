name: CI Build Verification

on:
  push:
    branches: [ "main" ]
  pull_request:
    branches: [ "main" ]

jobs:
  verify-environment:
    runs-on: ubuntu-latest

    steps:
    - name: Check out repository code
      uses: actions/checkout@v4

    - name: Set up Docker Buildx Engine
      uses: docker/setup-buildx-action@v3

    - name: Run Validation Build Test
      run: |
        docker build -t pump-scada-edge:test .